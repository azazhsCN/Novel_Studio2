<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novel Studio2 - 小说写作工作台</title>
<script src="https://cdn.jsdelivr.net/npm/marked@18.0.9/lib/marked.umd.js" integrity="sha384-kyb7rY2xnKgiRpRdAeNJxQ8e2SiGZy1m+FK9yME6M0eGJpg7EFaGGvf7+JSirgqE" crossorigin="anonymous"></script>
<style>
:root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eee;
    --text2: #aaa;
    --border: #333;
    --success: #4caf50;
    --warning: #ff9800;
    --danger: #f44336;
    --info: #2196f3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }
a { color: var(--info); text-decoration:none; }

/* Layout */
.app { display:flex; height:100vh; }
.sidebar { width:280px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.header { padding:16px 24px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.content { flex:1; overflow-y:auto; padding:24px; }

/* Sidebar */
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); }
.sidebar-header h2 { font-size:18px; color:var(--accent); }
.novel-list { flex:1; overflow-y:auto; padding:8px; }
.novel-item { padding:12px; border-radius:8px; cursor:pointer; margin-bottom:4px; transition:background 0.2s; }
.novel-item:hover { background:var(--bg3); }
.novel-item.active { background:var(--accent2); }
.novel-item .title { font-weight:600; }
.novel-item .meta { font-size:12px; color:var(--text2); margin-top:4px; }
.sidebar-footer { padding:12px; border-top:1px solid var(--border); }

/* Buttons */
.btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:14px; transition:opacity 0.2s; }
.btn:hover { opacity:0.85; }
.btn-primary { background:var(--accent); color:white; }
.btn-secondary { background:var(--bg3); color:white; }
.btn-success { background:var(--success); color:white; }
.btn-warning { background:var(--warning); color:white; }
.btn-danger { background:var(--danger); color:white; }
.btn-info { background:var(--info); color:white; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-block { width:100%; }

/* Forms */
.form-group { margin-bottom:16px; }
.form-group label { display:block; margin-bottom:6px; font-size:13px; color:var(--text2); }
.form-control { width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:14px; font-family:inherit; }
.form-control:focus { outline:none; border-color:var(--accent); }
textarea.form-control { resize:vertical; min-height:100px; }
select.form-control { appearance:none; }

/* Cards */
.card { background:var(--bg2); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; }
.card-header { padding:12px 16px; border-bottom:1px solid var(--border); font-weight:600; display:flex; justify-content:space-between; align-items:center; }
.card-body { padding:16px; }

/* Stats */
.stats { display:flex; gap:16px; margin-bottom:24px; }
.stat-card { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:16px; text-align:center; }
.stat-value { font-size:28px; font-weight:700; color:var(--accent); }
.stat-label { font-size:12px; color:var(--text2); margin-top:4px; }

/* Tabs */
.tabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:8px; }
.tab { padding:8px 16px; border-radius:6px 6px 0 0; cursor:pointer; font-size:13px; color:var(--text2); transition:all 0.2s; }
.tab:hover { color:var(--text); background:var(--bg3); }
.tab.active { color:var(--accent); border-bottom:2px solid var(--accent); }

/* Tables */
.table { width:100%; border-collapse:collapse; }
.table th, .table td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:13px; }
.table th { color:var(--text2); font-weight:600; }
.table tr:hover { background:var(--bg3); }

/* Badges */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-normal { background:#2d4a2d; color:#8f8; }
.badge-key { background:#4a3a2d; color:#fa0; }
.badge-turning { background:#4a2d2d; color:#f88; }
.badge-finalized { background:#2d3a4a; color:#8cf; }
.badge-audit-pass { background:#2d4a2d; color:#8f8; }
.badge-audit-fail { background:#4a2d2d; color:#f88; }

/* Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:12px; width:90%; max-width:800px; max-height:85vh; display:flex; flex-direction:column; }
.modal-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.modal-body { flex:1; overflow-y:auto; padding:20px; }
.modal-footer { padding:12px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

/* Toast */
.toast-container { position:fixed; top:16px; right:16px; z-index:200; }
.toast { padding:12px 20px; border-radius:8px; margin-bottom:8px; font-size:13px; animation:slideIn 0.3s; }
.toast-success { background:#2d4a2d; color:#8f8; border:1px solid #4a6; }
.toast-error { background:#4a2d2d; color:#f88; border:1px solid #a44; }

/* Global Loading Overlay */
.loading-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:300; align-items:center; justify-content:center; flex-direction:column; }
.loading-overlay.show { display:flex; }
.loading-overlay .spinner-lg { width:48px; height:48px; border:4px solid rgba(255,255,255,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
.loading-overlay .loading-text { color:var(--text); margin-top:16px; font-size:15px; }
.loading-overlay .loading-sub { color:var(--text2); margin-top:6px; font-size:13px; }
.toast-info { background:#2d3a4a; color:#8cf; border:1px solid #48a; }
@keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }

/* Welcome */
.welcome { text-align:center; padding:80px 40px; }
.welcome h1 { font-size:32px; color:var(--accent); margin-bottom:12px; }
.welcome p { color:var(--text2); font-size:16px; }

/* Loading */
.loading { text-align:center; padding:40px; color:var(--text2); }
.spinner { display:inline-block; width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Character card */
.char-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:8px; }
.char-card .name { font-weight:700; color:var(--accent); }

/* Chapter reader */
#chapterReader .card-body { max-height:70vh; overflow-y:auto; }
#chapterReader .card-body::-webkit-scrollbar { width:6px; }
#chapterReader .card-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* Conflict item */
.conflict-item { background:var(--bg); border-left:3px solid var(--warning); padding:12px; margin-bottom:8px; border-radius:0 8px 8px 0; }
.conflict-item.resolved { border-left-color:var(--success); opacity:0.6; }

/* Markdown body */
.markdown-body table { width:100%; border-collapse:collapse; margin:8px 0; }
.markdown-body th, .markdown-body td { padding:8px 12px; border:1px solid var(--border); text-align:left; font-size:13px; }
.markdown-body th { background:var(--bg3); color:var(--text2); font-weight:600; }
.markdown-body h3 { margin:12px 0 8px; color:var(--accent); font-size:15px; }
.markdown-body blockquote { border-left:3px solid var(--warning); padding:8px 12px; margin:8px 0; background:var(--bg); border-radius:0 6px 6px 0; }
.markdown-body p { margin:4px 0; line-height:1.6; }
.markdown-body strong { color:var(--text); }
.markdown-body ul, .markdown-body ol { padding-left:20px; margin:4px 0; }
.markdown-body li { margin:2px 0; line-height:1.5; }
</style>
</head>
<body>
<div class="app" id="app">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Novel Studio2</h2>
            <div style="font-size:12px;color:var(--text2);margin-top:4px;">小说写作工作台 ver26.8.13</div>
        </div>
        <div class="novel-list" id="novelList"></div>
        <div class="sidebar-footer">
            <button class="btn btn-primary btn-block" data-action="showCreateNovel">+ 新建小说项目</button>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="header" id="mainHeader">
            <span>请选择或创建一个小说项目</span>
        </div>
        <div class="content" id="mainContent">
            <div class="welcome">
                <h1>Novel Studio2</h1>
                <p>AI驱动的小说写作智能体工作台</p>
                <p style="margin-top:20px;color:var(--text2);">从左侧选择一个项目，或创建新项目开始写作</p>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <span id="modalTitle">标题</span>
            <button class="btn btn-sm btn-secondary" data-action="closeModal">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-lg"></div>
    <div class="loading-text" id="loadingText">AI 正在处理中...</div>
    <div class="loading-sub" id="loadingSub">请耐心等待，这可能需要一些时间</div>
</div>

<script>
// ========== State ==========
let currentNovelId = null;
let novels = [];

function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');
}

function renderMarkdown(md) {
    // marked 不消毒输出：内容已由调用方 escapeHtml，这里再过滤 javascript:/data: 链接，
    // 防止 LLM 输出中的 markdown 链接语法变成可点击的恶意链接
    let html;
    if (typeof marked !== 'undefined' && marked.parse) {
        try {
            html = marked.parse(md);
        } catch (e) { html = escapeHtml(md).replace(/\n/g, '<br>'); }
    } else {
        // marked 未加载（离线/CDN失败）：降级为纯文本
        html = escapeHtml(md).replace(/\n/g, '<br>');
    }
    return String(html)
        .replace(/(<a\s[^>]*href=["'])javascript:[^"']*(["'])/gi, '$1#$2')
        .replace(/(<a\s[^>]*href=["'])data:[^"']*(["'])/gi, '$1#$2');
}

// ========== API ==========
async function api(path, options = {}) {
    const url = path.startsWith('http') ? path : path;
    const resp = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options,
    });
    if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: resp.statusText }));
        let msg = err.detail;
        if (Array.isArray(msg)) {
            msg = msg.map(e => `${e.loc?.join('.')} ${e.msg}`).join('; ');
        } else if (typeof msg === 'object') {
            msg = JSON.stringify(msg);
        }
        throw new Error(msg || `请求失败 (${resp.status})`);
    }
    return resp.json();
}

// ========== Streaming API ==========
async function apiStream(path, options, onToken, onDone) {
    const resp = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options,
    });
    if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: resp.statusText }));
        throw new Error(err.detail || '请求失败');
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let gotDone = false;

    try {
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                let event;
                try { event = JSON.parse(line.slice(6)); } catch (e) { continue; }
                if (event.type === 'token' && onToken) onToken(event.content);
                else if (event.type === 'done' && onDone) { gotDone = true; onDone(event.chapter); }
                else if (event.type === 'error') throw new Error(event.message || '生成中断');
            }
        }
        // 冲刷解码器残留，处理末行无换行符的最后一条事件
        const tail = decoder.decode() + buffer;
        if (tail.startsWith('data: ')) {
            let event;
            try { event = JSON.parse(tail.slice(6)); } catch (e) { event = null; }
            if (event && event.type === 'done' && onDone) { gotDone = true; onDone(event.chapter); }
            else if (event && event.type === 'error') throw new Error(event.message || '生成中断');
        }
    } catch (e) {
        reader.cancel().catch(() => {});
        throw e;
    }
    if (!gotDone) {
        // 连接关闭但未收到完成事件：视为中断失败，避免界面永久锁死在"生成中"
        throw new Error('生成中断：连接意外关闭');
    }
}

// ========== Toast ==========
function toast(msg, type = 'info') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 4000);
}

// ========== Loading Overlay ==========
function showLoading(text = 'AI 正在处理中...', sub = '请耐心等待，这可能需要一些时间') {
    document.getElementById('loadingText').textContent = text;
    document.getElementById('loadingSub').textContent = sub;
    document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('show');
}

// ========== Modal ==========
function showModal(title, bodyHtml, footerHtml = '') {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalFooter').innerHTML = footerHtml;
    document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
}

// ========== Novel List ==========
async function loadNovels() {
    try {
        const data = await api('/api/novels');
        novels = data.novels;
        renderNovelList();
    } catch (e) { toast(e.message, 'error'); }
}

function renderNovelList() {
    const el = document.getElementById('novelList');
    if (!novels.length) {
        el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">暂无项目</div>';
        return;
    }
    el.innerHTML = novels.map(n => `
        <div class="novel-item ${n.id === currentNovelId ? 'active' : ''}" data-action="selectNovel" data-novel-id="${escapeHtml(n.id)}">
            <div class="title">${escapeHtml(n.title)}</div>
            <div class="meta">已定稿 ${n.total_finalized} 章 | 待写 ${n.total_planned} 章</div>
        </div>
    `).join('');
}

// ========== Select Novel ==========
let novelSwitchToken = 0;  // 切换序号：防止慢响应覆盖当前小说界面

async function selectNovel(id) {
    currentNovelId = id;
    renderNovelList();
    const token = ++novelSwitchToken;
    await loadNovelDashboard(id, token);
}

// ========== Novel Dashboard ==========
async function loadNovelDashboard(novelId, token) {
    const header = document.getElementById('mainHeader');
    const content = document.getElementById('mainContent');

    try {
        const novel = await api(`/api/novels/${novelId}`);
        // 竞态保护：等待期间用户已切换到别的小说，则丢弃本次渲染
        if (token !== undefined && token !== novelSwitchToken) return;
        header.innerHTML = `
            <span style="font-size:18px;font-weight:600;">${escapeHtml(novel.title)}</span>
            <div>
                <button class="btn btn-sm btn-secondary" data-action="showImportModal">导入小说</button>
                <button class="btn btn-sm btn-secondary" data-action="showEditNovelModal">设置</button>
                <button class="btn btn-sm btn-danger" data-action="deleteNovel" data-novel-id="${escapeHtml(novelId)}">删除</button>
            </div>
        `;

        content.innerHTML = `
            <!-- Stats -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value">${novel.total_finalized}</div>
                    <div class="stat-label">已定稿章节</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${novel.total_planned}</div>
                    <div class="stat-label">待写章节</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${novel.total_word_count ? (novel.total_word_count / 10000).toFixed(1) + '万' : 0}</div>
                    <div class="stat-label">累计字数</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-action="switchTab" data-tab="tab-plans">章节规划</div>
                <div class="tab" data-action="switchTab" data-tab="tab-writing">写作工作台</div>
                <div class="tab" data-action="switchTab" data-tab="tab-chapters">已写章节</div>
                <div class="tab" data-action="switchTab" data-tab="tab-prompt">核心提示词</div>
                <div class="tab" data-action="switchTab" data-tab="tab-audit">审计系统</div>
                <div class="tab" data-action="switchTab" data-tab="tab-samples">文风样本</div>
            </div>

            <!-- Tab: Plans -->
            <div id="tab-plans" class="tab-content">
                <div style="margin-bottom:16px;display:flex;gap:8px;">
                    <button class="btn btn-primary" data-action="showGeneratePlanModal">+ AI生成规划</button>
                </div>
                <div id="plansList"><div class="loading"><span class="spinner"></span> 加载中...</div></div>
            </div>

            <!-- Tab: Writing Workspace -->
            <div id="tab-writing" class="tab-content" style="display:none;">
                <div id="writingWorkspace">
                    <div class="loading"><span class="spinner"></span> 加载中...</div>
                </div>
            </div>

            <!-- Tab: Chapters -->
            <div id="tab-chapters" class="tab-content" style="display:none;">
                <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center;">
                    <button class="btn btn-primary" data-action="exportAllChapters">导出全部章节</button>
                    <span style="color:var(--text2);font-size:13px;">导出已定稿章节（无定稿则导出全部）</span>
                </div>
                <div id="chaptersList"><div class="loading"><span class="spinner"></span> 加载中...</div></div>
                <div id="chapterReader" style="display:none;"></div>
            </div>

            <!-- Tab: Core Prompt -->
            <div id="tab-prompt" class="tab-content" style="display:none;">
                <div id="promptEditor"><div class="loading"><span class="spinner"></span> 加载中...</div></div>
            </div>

            <!-- Tab: Audit -->
            <div id="tab-audit" class="tab-content" style="display:none;">
                <div id="auditPanel"><div class="loading"><span class="spinner"></span> 加载中...</div></div>
            </div>

            <!-- Tab: Style Samples -->
            <div id="tab-samples" class="tab-content" style="display:none;">
                <div style="margin-bottom:16px;">
                    <input type="file" id="styleFile" accept=".txt" style="display:none" onchange="uploadStyleSample(this)">
                    <button class="btn btn-primary" data-action="openStyleFilePicker">上传文风样本</button>
                </div>
                <div id="samplesList"><div class="loading"><span class="spinner"></span> 加载中...</div></div>
            </div>
        `;

        // Load first tab data
        loadPlans(novelId);
    } catch (e) { toast(e.message, 'error'); }
}

// ========== Tabs ==========
function switchTab(el, tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
    el.classList.add('active');
    document.getElementById(tabId).style.display = 'block';

    if (tabId === 'tab-plans') loadPlans();
    else if (tabId === 'tab-writing') loadWritingWorkspace();
    else if (tabId === 'tab-chapters') loadChapters();
    else if (tabId === 'tab-prompt') loadPromptEditor();
    else if (tabId === 'tab-audit') loadAuditPanel();
    else if (tabId === 'tab-samples') loadSamples();
}

// ========== Plans ==========
async function loadPlans(novelId) {
    // 优先用调用方传入的 novelId，避免切换小说后读到全局 currentNovelId 的新值
    const nid = novelId || currentNovelId;
    const el = document.getElementById('plansList');
    try {
        const data = await api(`/api/novels/${nid}/chapters/plans`);
        if (!data.plans.length) {
            el.innerHTML = '<div style="text-align:center;color:var(--text2);padding:40px;">暂无章节规划，点击上方按钮生成</div>';
            return;
        }
        let html = '';
        for (const plan of data.plans) {
            html += `<div class="card"><div class="card-header">
                <span>第${plan.start_chapter}-${plan.end_chapter}章规划</span>
                <div>
                    <button class="btn btn-sm btn-danger" data-action="deletePlan" data-plan-id="${escapeHtml(plan.id)}">删除</button>
                </div>
            </div><div class="card-body">`;
            if (plan.direction_hint) {

async function loadChapters() {
    const el = document.getElementById('chaptersList');
    const reader = document.getElementById('chapterReader');
    if (reader) reader.style.display = 'none';
    if (el) el.style.display = 'block';

    try {
        const data = await api(`/api/novels/${currentNovelId}/chapters`);
        if (!data.chapters.length) {
            el.innerHTML = '<div style="text-align:center;color:var(--text2);padding:40px;">暂无已写章节</div>';
            return;
        }
        let html = '<table class="table"><tr><th>章号</th><th>标题</th><th>类型</th><th>字数</th><th>状态</th><th>操作</th></tr>';
        for (const ch of data.chapters) {
            const badge = ch.chapter_type === 'turning' ? 'badge-turning' : ch.chapter_type === 'key' ? 'badge-key' : 'badge-normal';
            const typeLabel = ch.chapter_type === 'turning' ? '转折' : ch.chapter_type === 'key' ? '重点' : '普通';
            const statusBadges = [];
            if (ch.is_finalized) statusBadges.push('<span class="badge badge-finalized">已定稿</span>');
            if (ch.audit_passed) statusBadges.push('<span class="badge badge-audit-pass">审计通过</span>');
            else if (ch.audit_passed === false) statusBadges.push('<span class="badge badge-audit-fail">有冲突</span>');
            html += `<tr>
                <td>${ch.chapter_number}</td>
                <td>${escapeHtml(ch.title)}</td>
                <td><span class="badge ${badge}">${typeLabel}</span></td>
                <td>${ch.word_count}字</td>
                <td>${statusBadges.join(' ')}</td>
                <td>
                    <button class="btn btn-sm btn-primary" data-action="openChapterReader" data-chapter="${ch.chapter_number}">阅读</button>
                    <button class="btn btn-sm btn-warning" data-action="switchToWritingForChapter" data-chapter="${ch.chapter_number}">修改</button>
                    <button class="btn btn-sm btn-${ch.is_finalized ? 'secondary' : 'success'}" data-action="toggleFinalize" data-chapter="${ch.chapter_number}" data-finalized="${!ch.is_finalized}">${ch.is_finalized ? '取消定稿' : '定稿'}</button>
                    <button class="btn btn-sm btn-info" data-action="runAudit" data-chapter="${ch.chapter_number}">审计</button>
                    <button class="btn btn-sm btn-secondary" data-action="exportChapter" data-chapter="${ch.chapter_number}">导出</button>
                </td>

        }
        html += '</table>';
        el.innerHTML = html;
    } catch (e) { el.innerHTML = `<div style="color:var(--danger)">${escapeHtml(e.message)}</div>`; }
}

async function openChapterReader(chapterNumber) {
    const listEl = document.getElementById('chaptersList');
    const readerEl = document.getElementById('chapterReader');

    listEl.style.display = 'none';
    readerEl.style.display = 'block';

    try {
        const ch = await api(`/api/novels/${currentNovelId}/chapters/${chapterNumber}`);
        const badge = ch.chapter_type === 'turning' ? 'badge-turning' : ch.chapter_type === 'key' ? 'badge-key' : 'badge-normal';
        const typeLabel = ch.chapter_type === 'turning' ? '转折' : ch.chapter_type === 'key' ? '重点' : '普通';

        readerEl.innerHTML = `
            <div style="margin-bottom:16px;">
                <button class="btn btn-sm btn-secondary" data-action="loadChapters">← 返回列表</button>
            </div>
            <div class="card">
                <div class="card-header" style="font-size:18px;">

                    <div style="display:flex;gap:6px;">
                        <span class="badge ${badge}">${typeLabel}</span>
                        <span class="badge badge-normal">${ch.word_count}字</span>
                        ${ch.is_finalized ? '<span class="badge badge-finalized">已定稿</span>' : ''}
                    </div>
                </div>
                <div class="card-body" style="padding:24px 32px;" id="chapterReaderContent"></div>
            </div>
            <div style="margin-top:16px;display:flex;gap:8px;">
                <button class="btn btn-warning" data-action="switchToWritingForChapter" data-chapter="${ch.chapter_number}">修改本章</button>
                <button class="btn btn-${ch.is_finalized ? 'secondary' : 'success'}" data-action="toggleFinalize" data-chapter="${ch.chapter_number}" data-finalized="${!ch.is_finalized}">${ch.is_finalized ? '取消定稿' : '定稿'}</button>
                <button class="btn btn-info" data-action="runAudit" data-chapter="${ch.chapter_number}">审计</button>
                <button class="btn btn-secondary" data-action="exportChapter" data-chapter="${ch.chapter_number}">导出TXT</button>

        contentDiv.style.lineHeight = '2';

    } catch (e) {

function renderCharCard(c, i) {

    const level = c.role_level || 'main';
    const color = levelColors[level] || levelColors.main;
    const bgPreview = escapeHtml((c.background || '').substring(0, 60));

    return `<div class="char-card" id="char-${i}" style="border-left:3px solid ${color};">
        <div style="display:flex;gap:8px;align-items:center;cursor:pointer;" data-action="toggleCharCard" data-char-index="${i}">
            <span class="name" style="white-space:nowrap;">${escapeHtml(c.name) || '未命名'}</span>
            <select class="form-control" data-field="role_level" style="width:auto;padding:1px 4px;height:24px;font-size:12px;"
                onclick="event.stopPropagation()" onchange="this.closest('.char-card').style.borderLeftColor=this.value==='main'?'#e94560':this.value==='secondary'?'#ff9800':'#888'">
                <option value="main" ${level==='main'?'selected':''}>主要</option>
                <option value="secondary" ${level==='secondary'?'selected':''}>次要</option>
                <option value="marginal" ${level==='marginal'?'selected':''}>边缘</option>
            </select>
            <span style="color:var(--text2);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${bgPreview}${bgPreview.length >= 60 ? '...' : ''}</span>
            <div style="display:flex;align-items:center;gap:4px;white-space:nowrap;">
                <span style="color:var(--text2);font-size:16px;" id="char-arrow-${i}">&#9654;</span>
                <button class="btn btn-sm btn-danger" data-action="removeCharCard" data-char-index="${i}">删除</button>
            </div>
        </div>
        <div id="char-detail-${i}" style="display:none;margin-top:10px;">
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
                <div><label>姓名</label><input class="form-control" value="${escapeHtml(c.name)}" data-field="name"></div>
                <div><label>年龄</label><input class="form-control" value="${escapeHtml(c.age)}" data-field="age"></div>
                <div><label>首次出场</label><input class="form-control" value="${c.first_chapter || ''}" data-field="first_chapter" type="number"></div>
                <div><label>外貌</label><input class="form-control" value="${escapeHtml(c.appearance)}" data-field="appearance"></div>
                <div><label>性格</label><input class="form-control" value="${escapeHtml(c.personality)}" data-field="personality"></div>
                <div><label>当前状态</label><input class="form-control" value="${escapeHtml(c.current_status)}" data-field="current_status"></div>
                <div style="grid-column:span 2"><label>背景</label><textarea class="form-control" rows="2" data-field="background">${escapeHtml(c.background)}</textarea></div>
                <div style="grid-column:span 1"><label>关系</label><textarea class="form-control" rows="2" data-field="relationships">${escapeHtml(c.relationships)}</textarea></div>
                <div style="grid-column:span 3"><label>角色弧线</label><textarea class="form-control" rows="2" data-field="arc">${escapeHtml(c.arc)}</textarea></div>
                <div style="grid-column:span 3"><label>剧情重要性</label><input class="form-control" value="${escapeHtml(c.plot_importance || '')}" data-field="plot_importance"></div>
            </div>
        </div>
    </div>`;
}

function toggleCharCard(i) {
    const detail = document.getElementById(`char-detail-${i}`);
    const arrow = document.getElementById(`char-arrow-${i}`);
    if (detail.style.display === 'none') {
        detail.style.display = 'block';
        arrow.innerHTML = '&#9660;';
    } else {
        detail.style.display = 'none';
        arrow.innerHTML = '&#9654;';
    }
}

let charCardsData = [];
function addCharacterCard() {
    _syncCharCardsFromDOM();
    charCardsData.push({ name:'', role_level:'main', age:'', appearance:'', personality:'', background:'', relationships:'', current_status:'', arc:'', first_chapter:0, plot_importance:'' });
    const el = document.getElementById('characterCards');
    el.innerHTML = charCardsData.map((c, i) => renderCharCard(c, i)).join('');
}
function _syncCharCardsFromDOM() {
    const cards = document.querySelectorAll('.char-card');
    charCardsData = [];
    cards.forEach(card => {
        const c = {};
        card.querySelectorAll('[data-field]').forEach(input => {
            c[input.dataset.field] = input.value;
        });
        charCardsData.push(c);
    });
}
function removeCharCard(i) {
    _syncCharCardsFromDOM();
    charCardsData.splice(i, 1);
    const el = document.getElementById('characterCards');
    el.innerHTML = charCardsData.map((c, idx) => renderCharCard(c, idx)).join('');
}

async function savePrompt() {
    try {
        const cards = [];
        document.querySelectorAll('.char-card').forEach(card => {
            const c = {};
            card.querySelectorAll('[data-field]').forEach(input => {
                let val = input.value;
                if (input.dataset.field === 'first_chapter' && val) {
                    val = parseInt(val) || 0;
                }
                c[input.dataset.field] = val;
            });
            if (c.name) cards.push(c);
        });

        const basic = document.getElementById('prompt-basic');
        const plot = document.getElementById('prompt-plot');
        const style = document.getElementById('prompt-style');
        const dir = document.getElementById('prompt-direction');

        if (!basic || !plot) {
            toast('页面元素未加载，请稍后再试', 'error');
            return;
        }

        const payload = {
            basic_setting: basic.value,
            character_cards: cards,
            plot_overview: plot.value,
            writing_style: style ? style.value : '',
            continuation_direction: dir ? dir.value : '',
        };

        const resp = await fetch(`/api/novels/${currentNovelId}/core-prompt`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
        });
        if (!resp.ok) {
            const errText = await resp.text();
            throw new Error(`保存失败 (${resp.status}): ${errText.substring(0, 200)}`);
        }
        toast('核心提示词已保存', 'success');
    } catch (e) { toast(e.message, 'error'); }
}

// ========== Audit ==========
async function loadAuditPanel() {
    const el = document.getElementById('auditPanel');
    try {
        const data = await api(`/api/novels/${currentNovelId}/audit/report`);
        let html = `
            <div class="stats">
                <div class="stat-card"><div class="stat-value">${data.total_resources}</div><div class="stat-label">追踪资源数</div></div>
                <div class="stat-card"><div class="stat-value">${data.total_conflicts}</div><div class="stat-label">总冲突数</div></div>
                <div class="stat-card"><div class="stat-value">${data.resolved_conflicts}</div><div class="stat-label">已解决冲突</div></div>
            </div>
        `;

        // Resources (editable tables)
        const categories = [
            { key: 'wealth', label: '财富/资产' },
            { key: 'item', label: '重要物品' },
            { key: 'system', label: '系统/数值' },
            { key: 'character_status', label: '人物状态' },
            { key: 'foreshadow', label: '伏笔/悬念' },
        ];
        for (const cat of categories) {
            const items = data.resources[cat.key] || [];
            if (items.length) {
                let tableHtml = `<table class="table"><tr><th>名称</th><th>值</th><th>状态</th><th>备注</th><th>操作</th></tr>`;
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    const statusLabel = item.status === 'active' ? '生效中' : item.status === 'destroyed' ? '已销毁' : item.status === 'resolved' ? '已回收' : escapeHtml(item.status);
                    tableHtml += `<tr>
                        <td>${escapeHtml(item.name)}</td>
                        <td>${escapeHtml(item.value)}</td>
                        <td>${statusLabel}</td>
                        <td style="color:var(--text2);font-size:12px;">${escapeHtml(item.notes || '')}</td>
                        <td>
                            <button class="btn btn-sm btn-secondary" data-action="editResource" data-category="${escapeHtml(cat.key)}" data-index="${i}">编辑</button>
                            <button class="btn btn-sm btn-danger" data-action="deleteResource" data-category="${escapeHtml(cat.key)}" data-index="${i}">删除</button>
                        </td>
                    </tr>`;
                }
                tableHtml += '</table>';
                html += `<div class="card"><div class="card-header">${cat.label}</div><div class="card-body">${tableHtml}</div></div>`;
            }
        }

        // Unresolved conflicts (markdown rendering)
        const conflicts = data.unresolved_conflicts || [];
        if (conflicts.length) {
            html += `<div class="card"><div class="card-header" style="color:var(--warning)">未解决冲突</div><div class="card-body">`;
            for (let i = 0; i < conflicts.length; i++) {
                const c = conflicts[i];
                const idx = c.actual_index !== undefined ? c.actual_index : i;
                let md = `**第${c.chapter_number}章** [${escapeHtml(c.conflict_type)}]\n\n`;
                md += `${escapeHtml(c.description)}\n\n`;
                md += `> 建议：${escapeHtml(c.suggestion)}\n`;
                html += `<div class="conflict-item">
                    <div class="markdown-body">${renderMarkdown(md)}</div>
                    <div style="margin-top:8px;">
                        <button class="btn btn-sm btn-secondary" title="标记为误报" data-action="resolveConflict" data-index="${idx}" data-resolution="ignore">忽略</button>
                        <button class="btn btn-sm btn-warning" title="标记为已手动更新" data-action="resolveConflict" data-index="${idx}" data-resolution="update_resource">更新资源表</button>
                    </div>
                </div>`;
            }
            html += '</div></div>';
        }

        el.innerHTML = html || '<div style="text-align:center;color:var(--text2);padding:40px;">暂无审计数据，先写几章再来看看</div>';
    } catch (e) { el.innerHTML = `<div style="color:var(--danger)">${escapeHtml(e.message)}</div>`; }
}

                    </div>
                </div>
                <div style="flex:1;display:flex;flex-direction:column;gap:12px;">
                    <div id="writingHeader" style="color:var(--text2);font-size:14px;">请从左侧选择一个章节开始写作</div>
                    <div id="writingStyleStatus" style="font-size:12px;color:var(--text2);display:none;">
                        <span class="spinner" style="width:12px;height:12px;border-width:1.5px;display:none;" id="writingStyleSpinner"></span>
                        <span id="writingStyleText"></span>
                    </div>
                    <div id="writingOutput" style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-y:auto;white-space:pre-wrap;font-size:14px;line-height:1.8;min-height:200px;">
                        <span style="color:var(--text2)">AI生成的内容将在此实时显示...</span>
                    </div>
                    <div id="writingEditArea" style="display:none;flex:1;">
                        <textarea class="form-control" id="writingEditText" style="width:100%;height:100%;min-height:200px;font-size:14px;line-height:1.8;resize:vertical;"></textarea>

                    <div id="writingActions" style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary" id="btnWriteChapter" data-action="doWriteInWorkspace">开始写作</button>

                    <div id="writingRevisionArea" style="display:none;">
                        <div style="display:flex;flex-direction:column;gap:8px;">

function selectWritingPlan(chapterNumber) {
    writingSelectedPlan = chapterNumber;
    writingEditMode = false;
    document.querySelectorAll('#writingPlanList .novel-item').forEach(el => el.style.background = '');
    const el = document.getElementById(`wp-${chapterNumber}`);
    if (el) el.style.background = 'var(--accent2)';

    document.getElementById('writingOutput').style.display = '';
    document.getElementById('writingEditArea').style.display = 'none';

    loadExistingChapter(chapterNumber);

function renderWritingActions(isFinalized) {
    document.getElementById('writingActions').innerHTML = `
        <button class="btn btn-primary" data-action="doWriteInWorkspace">重新生成</button>
        <button class="btn btn-warning" data-action="toggleEditMode">手动编辑</button>
        <button class="btn btn-${isFinalized ? 'secondary' : 'success'}" data-action="doFinalizeInWorkspace">${isFinalized ? '取消定稿' : '定稿'}</button>
        <button class="btn btn-info" data-action="doAuditInWorkspace">审计</button>
        <button class="btn btn-secondary" data-action="doExportInWorkspace">导出TXT</button>
    `;
}

// 编辑态的按钮组增强：注入保存按钮、重命名编辑按钮
function applyEditModeUI() {
    const actionsEl = document.getElementById('writingActions');
    actionsEl.querySelectorAll('.btn-warning').forEach(b => { if (b.textContent === '手动编辑') b.textContent = '取消编辑'; });
    if (!document.getElementById('btnSaveEdit')) {
        const saveBtn = document.createElement('button');
        saveBtn.id = 'btnSaveEdit';
        saveBtn.className = 'btn btn-success';
        saveBtn.textContent = '保存 (Ctrl+S)';
        saveBtn.onclick = saveManualEdit;
        actionsEl.insertBefore(saveBtn, actionsEl.querySelector('.btn-warning'));

async function loadExistingChapter(chapterNumber) {
    const outputEl = document.getElementById('writingOutput');
    const headerEl = document.getElementById('writingHeader');
    const revisionEl = document.getElementById('writingRevisionArea');

    try {
        const ch = await api(`/api/novels/${currentNovelId}/chapters/${chapterNumber}`);
        // 竞态保护：等待期间用户已选择其他章节，丢弃本次结果
        if (chapterNumber !== writingSelectedPlan) return;
        headerEl.innerHTML = `第${chapterNumber}章 ${escapeHtml(ch.title)} <span style="color:var(--text2);font-size:12px;">${ch.word_count}字 | ${ch.is_finalized ? '已定稿' : '未定稿'}</span>`;
        outputEl.textContent = ch.content;
        writingStreamContent = ch.content;
        writingChapterFinalized = ch.is_finalized;
        renderWritingActions(ch.is_finalized);
        revisionEl.style.display = '';
    } catch (e) {
        if (chapterNumber !== writingSelectedPlan) return;
        headerEl.textContent = `已选择：第${chapterNumber}章（未写）`;
        outputEl.innerHTML = '<span style="color:var(--text2)">点击"开始写作"生成本章内容</span>';
        writingStreamContent = '';
        writingChapterFinalized = false;
        document.getElementById('writingActions').innerHTML = `<button class="btn btn-primary" id="btnWriteChapter" data-action="doWriteInWorkspace">开始写作</button>`;
        revisionEl.style.display = 'none';
    }
}

// ========== 流式渲染（按帧批量追加，避免每 token 全量重写） ==========
let _streamPending = '';
let _streamScheduled = false;
let _streamTextNode = null;

function resetStreamRender() {
    _streamPending = '';
    _streamScheduled = false;
    _streamTextNode = null;
}

function appendStreamToken(outputEl, token) {
    writingStreamContent += token;
    _streamPending += token;
    if (_streamScheduled) return;
    _streamScheduled = true;
    requestAnimationFrame(() => {
        _streamScheduled = false;
        if (!_streamPending || !outputEl.isConnected) return;
        if (!_streamTextNode || _streamTextNode.parentNode !== outputEl) {
            _streamTextNode = document.createTextNode('');
            outputEl.appendChild(_streamTextNode);
        }
        _streamTextNode.nodeValue += _streamPending;
        _streamPending = '';
        // 仅在接近底部时自动跟随滚动，避免打断用户回看
        const nearBottom = outputEl.scrollHeight - outputEl.scrollTop - outputEl.clientHeight < 60;
        if (nearBottom) outputEl.scrollTop = outputEl.scrollHeight;
    });
}

async function doWriteInWorkspace() {
    if (!writingSelectedPlan) { toast('请先选择章节', 'error'); return; }
    if (writingIsStreaming) { toast('正在生成中，请等待完成', 'error'); return; }

    writingIsStreaming = true;
    writingStreamContent = '';
    const outputEl = document.getElementById('writingOutput');
    const actionsEl = document.getElementById('writingActions');
    outputEl.innerHTML = '';
    resetStreamRender();
    // 首次写作的按钮带 id=btnWriteChapter；"重新生成"时按钮组已重建无此 id，需空指针保护
    actionsEl.querySelectorAll('button').forEach(b => b.disabled = true);
    const btn = document.getElementById('btnWriteChapter');
    if (btn) btn.textContent = '生成中...';

    try {
        await apiStream(
            `/api/novels/${currentNovelId}/chapters/write/stream`,
            { method: 'POST', body: JSON.stringify({ chapter_number: writingSelectedPlan }) },
            (token) => appendStreamToken(outputEl, token),
            (chapter) => {
                writingIsStreaming = false;
                writingChapterFinalized = false;
                renderWritingActions(false);
                document.getElementById('writingRevisionArea').style.display = '';
                if (writingEditMode) {
                    // 编辑态下重新生成：保留编辑UI并同步新内容
                    document.getElementById('writingEditText').value = writingStreamContent;
                    applyEditModeUI();
                }
                toast('章节生成完成！', 'success');
            }
        );
    } catch (e) {
        writingIsStreaming = false;
        actionsEl.querySelectorAll('button').forEach(b => b.disabled = false);
        if (btn) btn.textContent = '开始写作';
        toast('生成失败：' + e.message, 'error');
    }
}

async function doReviseInWorkspace() {
    if (!writingSelectedPlan) return;
    const opinion = document.getElementById('writingReviseInput').value;
    if (!opinion.trim()) { toast('请输入修改意见', 'error'); return; }
    if (writingIsStreaming) { toast('正在生成中，请等待', 'error'); return; }

    writingIsStreaming = true;
    writingStreamContent = '';
    const outputEl = document.getElementById('writingOutput');
    outputEl.innerHTML = '';
    resetStreamRender();

    try {
        await apiStream(
            `/api/novels/${currentNovelId}/chapters/${writingSelectedPlan}/revise/stream`,
            { method: 'POST', body: JSON.stringify({ revision意见: opinion }) },
            (token) => appendStreamToken(outputEl, token),
            (chapter) => {
                writingIsStreaming = false;
                writingChapterFinalized = false;
                document.getElementById('writingReviseInput').value = '';
                renderWritingActions(false);
                if (writingEditMode) {
                    document.getElementById('writingEditText').value = writingStreamContent;
                    applyEditModeUI();
                }
                toast('修改完成！', 'success');
            }
        );
    } catch (e) {
        writingIsStreaming = false;
        toast('修改失败：' + e.message, 'error');
    }
}

// Manual edit mode
function toggleEditMode() {
    if (writingIsStreaming) return;
    const outputEl = document.getElementById('writingOutput');
    const editArea = document.getElementById('writingEditArea');
    const editText = document.getElementById('writingEditText');
    const actionsEl = document.getElementById('writingActions');

    if (!writingEditMode) {
        // Switch to edit mode
        writingEditMode = true;
        editText.value = writingStreamContent;
        outputEl.style.display = 'none';
        editArea.style.display = '';
        editArea.style.flex = '1';
        applyEditModeUI();
    } else {
        // Switch back to display mode
        writingEditMode = false;
        outputEl.style.display = '';
        editArea.style.display = 'none';
        const btns = actionsEl.querySelectorAll('.btn-warning');
        btns.forEach(b => { if (b.textContent === '取消编辑') b.textContent = '手动编辑'; });
        const saveBtn = document.getElementById('btnSaveEdit');
        if (saveBtn) saveBtn.remove();
    }
}

async function saveManualEdit() {
    if (!writingSelectedPlan) return;
    const editText = document.getElementById('writingEditText');
    const content = editText.value;

    try {
        await api(`/api/novels/${currentNovelId}/chapters/${writingSelectedPlan}/content`, {
            method: 'PUT',
            body: JSON.stringify({ content }),
        });
        writingStreamContent = content;
        document.getElementById('writingOutput').textContent = content;
        toggleEditMode();
        toast('保存成功！', 'success');
    } catch (e) { toast('保存失败：' + e.message, 'error'); }
}

// Save on Ctrl+S in edit mode
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 's' && writingEditMode) {
        e.preventDefault();
        saveManualEdit();
    }
});

// AI targeted adjustment
async function doAIAdjustInWorkspace() {
    if (!writingSelectedPlan) return;
    const opinion = document.getElementById('writingReviseInput').value;
    if (!opinion.trim()) { toast('请输入调整要求（如：加强心理描写、修改对话风格等）', 'error'); return; }

    writingIsStreaming = true;
    writingStreamContent = '';
    const outputEl = document.getElementById('writingOutput');
    outputEl.innerHTML = '';
    resetStreamRender();

    try {
        await apiStream(

            { method: 'POST', body: JSON.stringify({ revision意见: `在保持整体剧情和结构不变的前提下，进行以下调整：${opinion}` }) },
            (token) => appendStreamToken(outputEl, token),
            (chapter) => {
                writingIsStreaming = false;
                writingChapterFinalized = false;
                document.getElementById('writingReviseInput').value = '';
                renderWritingActions(false);
                if (writingEditMode) {

        writingIsStreaming = false;
        toast('调整失败：' + e.message, 'error');
    }
}

async function doFinalizeInWorkspace() {
    if (!writingSelectedPlan) return;
    try {
        await api(`/api/novels/${currentNovelId}/chapters/${writingSelectedPlan}/finalize`, {
            method: 'PUT',
            body: JSON.stringify({ finalized: !writingChapterFinalized }),
        });
        writingChapterFinalized = !writingChapterFinalized;
        renderWritingActions(writingChapterFinalized);
        if (writingEditMode) applyEditModeUI();
        toast(`第${writingSelectedPlan}章已${writingChapterFinalized ? '定稿' : '取消定稿'}`, 'success');
        loadWritingWorkspace();
    } catch (e) { toast(e.message, 'error'); }
}

async function doAuditInWorkspace() {
    if (!writingSelectedPlan) return;
    toast(`正在审计第${writingSelectedPlan}章...`, 'info');
    try {
        const result = await api(`/api/novels/${currentNovelId}/chapters/${writingSelectedPlan}/audit`, { method: 'POST' });
        let md = `## 审计报告\n\n`;
        if (result.summary) md += `${escapeHtml(result.summary)}\n\n`;
        if (result.conflicts && result.conflicts.length) {
            md += `### 发现冲突\n\n`;
            for (const c of result.conflicts) {
                md += `- **[${escapeHtml(c.conflict_type)}]** ${escapeHtml(c.description)}\n  - 建议：${escapeHtml(c.suggestion)}\n`;
            }
        } else {
            md += `> 未发现冲突\n`;
        }
        showModal('审计报告', `<div class="markdown-body">${renderMarkdown(md)}</div>`,
            '<button class="btn btn-secondary" data-action="closeModal">关闭</button>');
    } catch (e) { toast(e.message, 'error'); }
}

function doExportInWorkspace() {
    if (!writingSelectedPlan) return;
    window.open(`/api/novels/${currentNovelId}/export/chapter/${writingSelectedPlan}`, '_blank');
}

function switchToWritingForChapter(chapterNumber) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');

// ========== Style Samples ==========
async function loadSamples() {
    const el = document.getElementById('samplesList');
    try {
        const data = await api(`/api/novels/${currentNovelId}/style-samples`);
        if (!data.samples.length) {
            el.innerHTML = '<div style="text-align:center;color:var(--text2);padding:40px;">暂无文风样本，上传后写作时会自动附加到提示词中</div>';
        } else {
            let html = '<div style="margin-bottom:12px;color:var(--text2);font-size:13px;">以下样本在写作时会自动附加到AI提示词中：</div>';
            for (const s of data.samples) {
                const sizeKB = (s.size / 1024).toFixed(1);
                html += `<div class="char-card" style="display:flex;justify-content:space-between;align-items:center;">
                    <span>${escapeHtml(s.name)}</span>
                    <span style="color:var(--text2);font-size:12px;">${sizeKB}KB</span>
                </div>`;
            }
            el.innerHTML = html;
        }
    } catch (e) { el.innerHTML = `<div style="color:var(--danger)">${escapeHtml(e.message)}</div>`; }
}

async function uploadStyleSample(input) {
    const file = input.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    try {
        const resp = await fetch(`/api/novels/${currentNovelId}/style-sample`, { method: 'POST', body: formData });
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({ detail: `上传失败 (${resp.status})` }));
            const detail = Array.isArray(err.detail) ? err.detail.map(x => x.msg).join('; ') : err.detail;
            throw new Error(detail || `上传失败 (${resp.status})`);
        }
        toast(`文风样本 "${file.name}" 上传成功`, 'success');
        await loadSamples();
        // 如果工作台可见，也更新状态
        const styleStatus = document.getElementById('writingStyleStatus');
        if (styleStatus) loadWritingWorkspace();
    } catch (e) { toast(e.message, 'error'); }
    input.value = '';
}

            <div style="text-align:center;padding:20px;">
                <div class="spinner" style="width:30px;height:30px;margin-bottom:12px;"></div>
                <div id="importStatusText" style="color:var(--text2);">正在分析小说内容，请稍候...</div>
                <div style="color:var(--text2);font-size:12px;margin-top:8px;">大文件分析可能需要2-5分钟</div>
            </div>
        </div>
    `, `<button class="btn btn-primary" id="importBtn" data-action="doImport">开始导入分析</button>
        <button class="btn btn-secondary" data-action="closeModal">取消</button>`);
}

async function doImport() {
    const fileInput = document.getElementById('importFile');
    const file = fileInput.files[0];
    if (!file) { toast('请选择文件', 'error'); return; }

    // 显示加载状态
    document.getElementById('importBtn').disabled = true;
    document.getElementById('importBtn').textContent = '分析中...';
    document.getElementById('importStatus').style.display = 'block';
    document.getElementById('importStatusText').textContent = `正在上传并分析 "${file.name}" (${(file.size/1024).toFixed(1)}KB)，请稍候...`;

    const formData = new FormData();
    formData.append('file', file);

    try {
        const resp = await fetch(`/api/novels/${currentNovelId}/import`, { method: 'POST', body: formData });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || '导入失败');

        // 展示分析结果
        showImportResult(data, file.name);
    } catch (e) {
        document.getElementById('importStatusText').innerHTML = `<span style="color:var(--danger)">错误：${escapeHtml(e.message)}</span>`;
        document.getElementById('importBtn').disabled = false;
        document.getElementById('importBtn').textContent = '重试';
        toast('导入失败：' + e.message, 'error');
    }
}

function showImportResult(data, fileName) {
    const a = data.analysis || {};
    const charCount = (a.character_cards || []).length;
    const plotLen = (a.plot_overview || '').length;
    const styleLen = (a.writing_style || '').length;

    let resultHtml = `
        <div style="background:var(--bg);padding:16px;border-radius:8px;margin-bottom:16px;">
            <div style="color:var(--success);font-weight:600;margin-bottom:8px;">导入分析完成</div>
            <div style="color:var(--text2);font-size:13px;">
                文件：${escapeHtml(fileName)} | 原文长度：${(data.original_length/1024).toFixed(1)}KB<br>
                提取角色：${charCount}个 | 剧情概述：${plotLen}字 | 文风分析：${styleLen}字
                ${data.chapters_created ? `<br>已创建章节：<strong style="color:var(--accent)">${data.chapters_created}章</strong>（已标记为定稿，可在"已写章节"查看）` : ''}
            </div>
        </div>
    `;

    if (a.error) {
        resultHtml += `<div style="color:var(--danger);padding:12px;background:var(--bg);border-radius:8px;">
            AI返回异常：${escapeHtml(a.error)}<br>
            <small>原始响应：${escapeHtml((a.raw || '').substring(0, 500))}</small>
        </div>`;
    } else {
        // 基础设定预览
        if (a.basic_setting) {
            resultHtml += `<div class="card"><div class="card-header">基础设定 <span style="color:var(--text2);font-size:12px;">(${a.basic_setting.length}字)</span></div>
                <div class="card-body" style="max-height:120px;overflow-y:auto;font-size:13px;white-space:pre-wrap;">${escapeHtml(a.basic_setting.substring(0, 500))}${a.basic_setting.length > 500 ? '...' : ''}</div></div>`;
        }
        // 角色卡片预览
        if (charCount > 0) {
            resultHtml += `<div class="card"><div class="card-header">人物设定 <span style="color:var(--text2);font-size:12px;">(${charCount}人)</span></div>
                <div class="card-body" style="max-height:120px;overflow-y:auto;">`;
            for (const c of a.character_cards) {
                resultHtml += `<span class="badge badge-key" style="margin:2px;">${escapeHtml(c.name)}</span> `;
            }
            resultHtml += `</div></div>`;
        }
        // 剧情概述预览
        if (a.plot_overview) {
            resultHtml += `<div class="card"><div class="card-header">剧情概述 <span style="color:var(--text2);font-size:12px;">(${plotLen}字)</span></div>
                <div class="card-body" style="max-height:120px;overflow-y:auto;font-size:13px;white-space:pre-wrap;">${escapeHtml(a.plot_overview.substring(0, 500))}${plotLen > 500 ? '...' : ''}</div></div>`;
        }
        // 文风分析预览
        if (a.writing_style) {
            resultHtml += `<div class="card"><div class="card-header">文风设定 <span style="color:var(--text2);font-size:12px;">(${styleLen}字)</span></div>
                <div class="card-body" style="max-height:100px;overflow-y:auto;font-size:13px;white-space:pre-wrap;">${escapeHtml(a.writing_style.substring(0, 400))}${styleLen > 400 ? '...' : ''}</div></div>`;
        }
    }

    showModal('导入分析结果', resultHtml, `
        <button class="btn btn-primary" data-action="confirmImportDashboard">确认并查看项目</button>
        <button class="btn btn-secondary" data-action="reopenImportModal">重新导入</button>
    `);
    toast('导入分析完成！已自动写入核心提示词', 'success');
}

// ========== Generate Plan ==========
async function showGeneratePlanModal() {
    let startVal = 1;
    try {
        const data = await api(`/api/novels/${currentNovelId}/chapters/plans/next-chapter`);
        startVal = data.next_chapter;
    } catch (e) { /* fallback to 1 */ }

    showModal('AI生成章节规划', `
        <div class="form-group"><label>起始章节号</label><input class="form-control" id="plan-start" type="number" value="${startVal}"></div>
        <div class="form-group"><label>规划章节数</label><input class="form-control" id="plan-num" type="number" value="10"></div>
        <div class="form-group"><label>方向提示词（可选，影响规划走向）</label>
            <textarea class="form-control" id="plan-hint" rows="4" placeholder="例如：这部分剧情涉及筱惠在日本的调教经历，不要增加新人物"></textarea>
        </div>
    `, `<button class="btn btn-primary" data-action="doGeneratePlan">生成规划</button>
        <button class="btn btn-secondary" data-action="closeModal">取消</button>`);
}

async function doGeneratePlan() {
    // 先读取表单值，再关闭弹窗
    const startVal = parseInt(document.getElementById('plan-start')?.value) || 1;
    const numVal = parseInt(document.getElementById('plan-num')?.value) || 10;
    const hintVal = document.getElementById('plan-hint')?.value || '';
    closeModal();
    showLoading('正在生成章节规划...', 'AI 正在分析上下文并规划章节');
    try {
        const data = await api(`/api/novels/${currentNovelId}/chapters/plans/generate`, {
            method: 'POST',
            body: JSON.stringify({
                start_chapter: startVal,
                num_chapters: numVal,
                direction_hint: hintVal,
            }),
        });
        toast('章节规划生成成功！', 'success');
        await loadPlans();
        await loadNovels();
    } catch (e) { toast(e.message, 'error'); }
    finally { hideLoading(); }
}

async function viewPlanDetail(planId, chapterNumber) {
    try {
        const plan = await api(`/api/novels/${currentNovelId}/chapters/plans/${planId}`);
        const ch = plan.chapters.find(c => c.chapter_number === chapterNumber);
        if (!ch) { toast('章节不存在', 'error'); return; }
        showModal(`第${ch.chapter_number}章 规划详情`, `
            <div class="form-group"><label>标题</label><input class="form-control" id="ep-title" value="${escapeHtml(ch.title)}"></div>
            <div style="display:flex;gap:16px;">
                <div class="form-group" style="flex:1"><label>类型</label>
                    <select class="form-control" id="ep-type">
                        <option value="normal" ${ch.chapter_type==='normal'?'selected':''}>普通</option>
                        <option value="key" ${ch.chapter_type==='key'?'selected':''}>重点</option>
                        <option value="turning" ${ch.chapter_type==='turning'?'selected':''}>转折</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1"><label>目标字数</label><input class="form-control" id="ep-words" type="number" value="${ch.word_count_target}"></div>
            </div>
            <div class="form-group"><label>时间</label><input class="form-control" id="ep-time" value="${escapeHtml(ch.time)}"></div>
            <div class="form-group"><label>场景</label><input class="form-control" id="ep-scene" value="${escapeHtml(ch.scene)}"></div>
            <div class="form-group"><label>核心情节（每行一条）</label><textarea class="form-control" id="ep-plot" rows="4">${escapeHtml((ch.core_plot||[]).join('\n'))}</textarea></div>
            <div class="form-group"><label>写作提示词</label><textarea class="form-control" id="ep-prompt" rows="6">${escapeHtml(ch.prompt)}</textarea></div>
        `, `<button class="btn btn-primary" data-action="savePlanEdit" data-plan-id="${escapeHtml(planId)}" data-chapter="${chapterNumber}">保存修改</button>
            <button class="btn btn-secondary" data-action="closeModal">关闭</button>`);
    } catch (e) { toast(e.message, 'error'); }
}

async function savePlanEdit(planId, chapterNumber) {
    try {
        await api(`/api/novels/${currentNovelId}/chapters/plans/${planId}/chapters/${chapterNumber}`, {
            method: 'PUT',
            body: JSON.stringify({
                title: document.getElementById('ep-title').value,
                chapter_type: document.getElementById('ep-type').value,
                word_count_target: parseInt(document.getElementById('ep-words').value) || 3000,
                time: document.getElementById('ep-time').value,
                scene: document.getElementById('ep-scene').value,
                core_plot: document.getElementById('ep-plot').value.split('\n').filter(x => x.trim()),
                prompt: document.getElementById('ep-prompt').value,
            }),
        });
        closeModal();
        toast('规划已更新', 'success');
        await loadPlans();
    } catch (e) { toast(e.message, 'error'); }
}

async function deletePlan(planId) {
    if (!confirm('确定删除此规划？')) return;
    try {
        await api(`/api/novels/${currentNovelId}/chapters/plans/${planId}`, { method: 'DELETE' });
        toast('规划已删除', 'success');
        await loadPlans();
    } catch (e) { toast(e.message, 'error'); }
}

async function deletePlanChapter(planId, chapterNumber) {
    if (!confirm(`确定删除第${chapterNumber}章的规划？`)) return;
    try {
        await api(`/api/novels/${currentNovelId}/chapters/plans/${planId}/chapters/${chapterNumber}`, { method: 'DELETE' });
        toast(`第${chapterNumber}章规划已删除`, 'success');
        await loadPlans();
    } catch (e) { toast(e.message, 'error'); }
}

async function toggleFinalize(chapterNumber, finalized) {
    try {
        await api(`/api/novels/${currentNovelId}/chapters/${chapterNumber}/finalize`, {
            method: 'PUT',
            body: JSON.stringify({ finalized }),
        });
        toast(`第${chapterNumber}章已${finalized ? '定稿' : '取消定稿'}`, 'success');
        await loadChapters();
        await loadNovels();
    } catch (e) { toast(e.message, 'error'); }
}

// ========== Audit ==========
async function runAudit(chapterNumber) {
    showLoading(`正在审计第${chapterNumber}章...`, 'AI 正在检查冲突和资源变动');
    try {
        const result = await api(`/api/novels/${currentNovelId}/chapters/${chapterNumber}/audit`, {
            method: 'POST',
        });
        let html = `<div style="margin-bottom:16px;">${escapeHtml(result.summary || '审计完成')}</div>`;
        if (result.conflicts && result.conflicts.length) {
            html += '<h3 style="color:var(--warning);margin-bottom:12px;">发现冲突</h3>';
            for (const c of result.conflicts) {
                html += `<div class="conflict-item">
                    <div><strong>[${escapeHtml(c.conflict_type)}]</strong></div>
                    <div>${escapeHtml(c.description)}</div>
                    <div style="font-size:12px;color:var(--text2);">建议：${escapeHtml(c.suggestion)}</div>
                </div>`;
            }
        } else {
            html += '<div style="color:var(--success);text-align:center;padding:20px;">未发现冲突</div>';
        }
        if (result.resource_changes && result.resource_changes.length) {
            html += '<h3 style="margin-top:16px;margin-bottom:12px;">资源变动</h3><table class="table"><tr><th>类型</th><th>名称</th><th>值</th><th>操作</th></tr>';
            for (const rc of result.resource_changes) {
                html += `<tr><td>${escapeHtml(rc.category)}</td><td>${escapeHtml(rc.name)}</td><td>${escapeHtml(rc.value)}</td><td>${escapeHtml(rc.action)}</td></tr>`;
            }
            html += '</table>';
        }
        showModal(`第${chapterNumber}章 审计报告`, html,
            `<button class="btn btn-secondary" data-action="closeModal">关闭</button>`);
        await loadChapters();
        await loadAuditPanel();
    } catch (e) { toast(e.message, 'error'); }
    finally { hideLoading(); }
}

async function resolveConflict(index, resolution) {
    try {
        await api(`/api/novels/${currentNovelId}/audit/resolve`, {
            method: 'POST',
            body: JSON.stringify({ conflict_index: index, resolution }),
        });
        toast('冲突已解决', 'success');
        await loadAuditPanel();
    } catch (e) { toast(e.message, 'error'); }
}

async function editResource(category, index) {
    // 获取当前资源数据
    let resData;
    try {
        resData = await api(`/api/novels/${currentNovelId}/audit/resources`);
    } catch (e) { toast(e.message, 'error'); return; }

    const items = (resData.resources || []).filter(r => r.category === category);
    if (index >= items.length) { toast('资源不存在', 'error'); return; }
    const item = items[index];

    showModal('编辑资源', `
        <div class="form-group"><label>名称</label><input class="form-control" id="er-name" value="${escapeHtml(item.name)}"></div>
        <div class="form-group"><label>值/状态</label><input class="form-control" id="er-value" value="${escapeHtml(item.value)}"></div>
        <div class="form-group"><label>状态</label>
            <select class="form-control" id="er-status">
                <option value="active" ${item.status==='active'?'selected':''}>生效中</option>
                <option value="resolved" ${item.status==='resolved'?'selected':''}>已回收</option>
                <option value="destroyed" ${item.status==='destroyed'?'selected':''}>已销毁</option>
            </select>
        </div>
        <div class="form-group"><label>备注</label><input class="form-control" id="er-notes" value="${escapeHtml(item.notes || '')}"></div>
    `, `<button class="btn btn-primary" data-action="saveResource" data-category="${escapeHtml(category)}" data-index="${index}">保存</button>
        <button class="btn btn-secondary" data-action="closeModal">取消</button>`);
}

async function saveResource(category, index) {
    try {
        await api(`/api/novels/${currentNovelId}/audit/resources/${category}/${index}`, {
            method: 'PUT',
            body: JSON.stringify({
                name: document.getElementById('er-name').value,
                value: document.getElementById('er-value').value,
                status: document.getElementById('er-status').value,
                notes: document.getElementById('er-notes').value,
            }),
        });
        closeModal();
        toast('资源已更新', 'success');
        await loadAuditPanel();
    } catch (e) { toast(e.message, 'error'); }
}

async function deleteResource(category, index) {
    if (!confirm('确定删除此资源项？')) return;
    try {
        await api(`/api/novels/${currentNovelId}/audit/resources/${category}/${index}`, { method: 'DELETE' });
        toast('资源已删除', 'success');
        await loadAuditPanel();
    } catch (e) { toast(e.message, 'error'); }
}

// ========== 事件委托 ==========
// 所有按钮用 data-action 声明动作、data-* 属性传参，统一在此分发。
// 替代 inline onclick：消除 HTML属性/JS字符串双重解析的注入面，并集中事件处理。
const ACTION_HANDLERS = {
    // 小说列表/仪表盘
    selectNovel: (el) => selectNovel(el.dataset.novelId),
    deleteNovel: (el) => deleteNovel(el.dataset.novelId),
    showCreateNovel: () => showCreateNovel(),
    showImportModal: () => showImportModal(),
    showEditNovelModal: () => showEditNovelModal(),
    switchTab: (el) => switchTab(el, el.dataset.tab),
    openStyleFilePicker: () => document.getElementById('styleFile').click(),
    // 规划
    showGeneratePlanModal: () => showGeneratePlanModal(),
    deletePlan: (el) => deletePlan(el.dataset.planId),
    deletePlanChapter: (el) => deletePlanChapter(el.dataset.planId, +el.dataset.chapter),
    viewPlanDetail: (el) => viewPlanDetail(el.dataset.planId, +el.dataset.chapter),
    // 章节
    loadChapters: () => loadChapters(),
    exportAllChapters: () => exportAllChapters(),
    openChapterReader: (el) => openChapterReader(+el.dataset.chapter),
    switchToWritingForChapter: (el) => switchToWritingForChapter(+el.dataset.chapter),
    toggleFinalize: (el) => toggleFinalize(+el.dataset.chapter, el.dataset.finalized === 'true'),
    runAudit: (el) => runAudit(+el.dataset.chapter),
    exportChapter: (el) => exportChapter(+el.dataset.chapter),
    // 写作工作台
    selectWritingPlan: (el) => selectWritingPlan(+el.dataset.chapter),
    doWriteInWorkspace: () => doWriteInWorkspace(),
    doReviseInWorkspace: () => doReviseInWorkspace(),
    doAIAdjustInWorkspace: () => doAIAdjustInWorkspace(),
    toggleEditMode: () => toggleEditMode(),
    doFinalizeInWorkspace: () => doFinalizeInWorkspace(),
    doAuditInWorkspace: () => doAuditInWorkspace(),
    doExportInWorkspace: () => doExportInWorkspace(),
    // 核心提示词
    savePrompt: () => savePrompt(),
    aiUpdateCharacters: () => aiUpdateCharacters(),
    aiUpdatePlotOverview: () => aiUpdatePlotOverview(),
    aiUpdateAll: () => aiUpdateAll(),
    addCharacterCard: () => addCharacterCard(),
    toggleCharCard: (el) => toggleCharCard(+el.dataset.charIndex),
    removeCharCard: (el, e) => { e.stopPropagation(); removeCharCard(+el.dataset.charIndex); },
    // 审计
    resolveConflict: (el) => resolveConflict(+el.dataset.index, el.dataset.resolution),
    editResource: (el) => editResource(el.dataset.category, +el.dataset.index),
    deleteResource: (el) => deleteResource(el.dataset.category, +el.dataset.index),
    saveResource: (el) => saveResource(el.dataset.category, +el.dataset.index),
    // 弹窗
    closeModal: () => closeModal(),
    createNovel: () => createNovel(),
    saveNovelSettings: () => saveNovelSettings(),
    doImport: () => doImport(),
    doGeneratePlan: () => doGeneratePlan(),
    savePlanEdit: (el) => savePlanEdit(el.dataset.planId, +el.dataset.chapter),
    // 组合动作（原 onclick 里的多语句）
    confirmImportDashboard: () => { closeModal(); loadNovelDashboard(currentNovelId); },
    reopenImportModal: () => { closeModal(); showImportModal(); },
};

document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const handler = ACTION_HANDLERS[el.dataset.action];
    if (handler) handler(el, e);
});

// ========== Init ==========
loadNovels();
</script>
</body>
</html>
